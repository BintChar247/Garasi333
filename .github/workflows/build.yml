name: Garasi build (Android + Windows)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # to publish the APK as a GitHub Release

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # Optional: a stable release key from repository secrets. Without these the release APK is
      # signed with the runner's debug key (installable, but each run's key differs).
      - name: Decode signing key
        env:
          KEYSTORE_B64: ${{ secrets.GARASI_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.GARASI_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.GARASI_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.GARASI_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > release.jks
            {
              echo "GARASI_KEYSTORE_PATH=release.jks"
              echo "GARASI_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "GARASI_KEY_ALIAS=$KEY_ALIAS"
              echo "GARASI_KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "Using release key from secrets."
          else
            echo "::warning::No GARASI_KEYSTORE_BASE64 secret — APK will be signed with a debug key."
          fi

      - name: Unit tests + release APK
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon --stacktrace :core:test assembleRelease 2>&1 | tee build.log

      - name: Report build errors
        if: failure()
        run: |
          [ -f build.log ] || exit 0
          grep -nE '^e: |error:|ERROR|FAILED|What went wrong|Exception|expected:|AAPT|> Could not|Caused by' build.log \
            | grep -v '^.*w: ' | head -n 80 > errors.txt || true
          msg=$(sed -e 's/%/%25/g' errors.txt | awk '{printf "%s%%0A", $0}')
          echo "::error title=Gradle build failed::${msg}"
          tail -n 60 build.log

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: app/build/reports/
          if-no-files-found: ignore

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk dist/garasi.apk
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: garasi-apk
          path: dist/*.apk


  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      - name: Build Windows app (installer + portable)
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace :desktop:packageMsi :desktop:createDistributable 2>&1 | tee build.log

      - name: Report build errors
        if: failure()
        run: |
          grep -nE '^e: |error:|FAILED|What went wrong|> Could not|Caused by' build.log | head -n 60 > errors.txt || true
          msg=$(sed -e 's/%/%25/g' errors.txt | awk '{printf "%s%%0A", $0}')
          echo "::error title=Windows build failed::${msg}"

      - name: Collect
        run: |
          mkdir -p dist
          cp desktop/build/compose/binaries/main/msi/*.msi dist/Garasi-Windows-Setup.msi
          powershell -NoProfile -Command "Compress-Archive -Path desktop/build/compose/binaries/main/app/Garasi -DestinationPath dist/Garasi-Windows-Portable.zip"
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: garasi-windows
          path: dist/*

  # Publish both apps to the "garasi-latest" release so they have stable download links:
  # https://github.com/<owner>/<repo>/releases/latest/download/garasi.apk
  # https://github.com/<owner>/<repo>/releases/latest/download/Garasi-Windows-Setup.msi
  release:
    if: github.event_name != 'pull_request'
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -R out
          gh release delete garasi-latest --cleanup-tag --yes || true
          gh release create garasi-latest out/garasi-apk/garasi.apk out/garasi-windows/* \
            --target "$GITHUB_SHA" \
            --title "Garasi (latest build)" \
            --notes "Built from ${GITHUB_SHA::7} on $(date -u +'%Y-%m-%d %H:%M UTC').

          **Android:** open this page on your phone → tap **garasi.apk** → Install (Android 8.0+).

          **Windows:** download **Garasi-Windows-Setup.msi** and run it (Windows 10/11). If SmartScreen warns, click *More info → Run anyway*. No installer rights? Use **Garasi-Windows-Portable.zip**, unzip and run Garasi.exe.

          Sync: in the Windows app open **Sync**, then on the phone go to Settings → Set up PC sync → Scan QR code (same Wi-Fi)."
